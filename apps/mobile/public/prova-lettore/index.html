<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <!-- The policy the reader of phase 10B must work under: no script but the page's own, nothing from the network. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Prova lettore" />
    <meta name="theme-color" content="#355e4a" />
    <title>Prova del lettore</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f3ec;
        --surface: #fffdf8;
        --text: #22201c;
        --muted: #6b665d;
        --line: #e2dccf;
        --accent: #355e4a;
        --ok: #2f6b45;
        --bad: #a3402f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171614;
          --surface: #211f1c;
          --text: #ece8df;
          --muted: #a39d92;
          --line: #35322d;
          --accent: #8fb9a1;
          --ok: #8fc9a3;
          --bad: #e08b7b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font: 600 22px/1.2 Georgia, serif;
      }
      header p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-weight: 500;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--bg);
      }
      button:disabled {
        opacity: 0.5;
      }
      #status {
        margin: 12px 0;
        color: var(--muted);
      }
      #stage {
        height: 46vh;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        overflow: hidden;
      }
      #stage foliate-view {
        display: block;
        width: 100%;
        height: 100%;
      }
      table {
        width: 100%;
        margin-top: 16px;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px 4px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      th {
        width: 48%;
        font-weight: 500;
        color: var(--muted);
      }
      td {
        font-variant-numeric: tabular-nums;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Prova del lettore</h1>
      <p>
        Apre un libro di 200 capitoli, gira 100 pagine e misura quanto ci mette ognuna. Poi apre un libro che prova
        a eseguire codice e a caricare risorse da Internet, e controlla che resti tutto bloccato.
      </p>
    </header>
    <main>
      <div class="actions">
        <button id="start" class="primary" type="button">Avvia la prova</button>
        <button id="copy" type="button" hidden>Copia i risultati</button>
      </div>
      <p id="status" role="status">Pronta.</p>
      <div id="stage"></div>
      <table id="results" hidden>
        <tbody></tbody>
      </table>
    </main>
    <script type="module" src="prova.js"></script>
  </body>
</html>
