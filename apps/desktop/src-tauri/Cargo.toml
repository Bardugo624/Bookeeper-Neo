[package]
name = "bookeeper-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "bookeeper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bookeeper-core = { path = "../../../crates/bookeeper-core" }
bookeeper-net = { path = "../../../crates/bookeeper-net" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["time", "rt", "sync", "net", "fs", "io-util"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
if-addrs = "0.13"
gethostname = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-process = "2"
semver = "1"
url = "2"
time = { version = "0.3", features = ["formatting"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
bookeeper-setup-core = { path = "../../../crates/bookeeper-setup-core" }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
