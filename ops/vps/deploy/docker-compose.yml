# Bookeeper behind the host's Caddy: plain HTTP on loopback, HTTPS at the proxy.
services:
  bookeeper:
    image: bookeeper-server:deploy
    container_name: bookeeper
    environment:
      BOOKEEPER_TLS: "off"
      BOOKEEPER_PUBLIC_URL: https://mobile.neokeeper.dev
    ports:
      - "127.0.0.1:7842:7842"
    volumes:
      - bookeeper-data:/data
    restart: unless-stopped
    mem_limit: 256m

volumes:
  bookeeper-data:
