# Bookeeper Neo — Hetzner CPX32 deployment, ISOLATED stack.
#
# Designed to coexist on a host that already runs other Docker workloads.
# Isolation guarantees:
#
#   1. Project name "bookeeper-neo" prefixes ALL resources (containers,
#      volumes, network) → no name collisions.
#   2. Dedicated bridge network with a fixed subnet far from common
#      defaults (172.31.7.0/24 is rarely used) and com.docker.network.
#      bridge.enable_icc=false would break inter-container traffic — we
#      keep ICC on but set internal=false plus an explicit subnet.
#   3. No `external: true` networks, no shared volumes, no `links` to
#      other compose projects.
#   4. Ports bound only to a specific host interface (HOST_BIND_IP) and
#      configurable port numbers (PUBLIC_HTTPS_PORT, ACME_HTTP_PORT) so
#      you can pick free ports if 80/443 are already taken on the host.
#   5. com.docker.compose.project label scopes everything; `docker
#      compose down` only removes Bookeeper resources.
#
# IMPORTANT — picking ports if your host already runs a reverse proxy on
# 80/443:
#
#   Option A (RECOMMENDED): TCP passthrough from your existing proxy.
#     Set PUBLIC_HTTPS_PORT=8443 and ACME_HTTP_PORT=8080. Configure your
#     existing proxy to TCP-passthrough bookeeper.albacremisi.org:443 to
#     127.0.0.1:8443 (and host:80 → 127.0.0.1:8080 for the ACME challenge).
#     Bookeeper-Caddy still terminates TLS and does mTLS itself.
#
#   Option B: dedicated public IP for Bookeeper. If the CPX32 has a
#     second floating IP, set HOST_BIND_IP to that address and keep
#     PUBLIC_HTTPS_PORT=443, ACME_HTTP_PORT=80. No interaction with the
#     existing 0.0.0.0:443 listener.
#
#   Option C: DNS-01 ACME (no port 80 needed at all). Requires a
#     Caddy build with the appropriate DNS provider plugin — not covered
#     here, ask if you need it.
#
# Required env (.env file next to this compose, NEVER commit):
#   TS_AUTHKEY, SERVER_HOST, ACME_EMAIL, TAILNET, HOST_BIND_IP,
#   PUBLIC_HTTPS_PORT, ACME_HTTP_PORT — see .env.example for guidance.

name: bookeeper-neo

services:
  # ---------------- Bookeeper Go server ----------------
  bookeeper-server:
    # Built locally from ../server. No published image exists yet; this
    # tags the build as `bookeeper-neo-server:local` so `docker compose
    # pull` becomes a no-op for it.
    image: bookeeper-neo-server:local
    build:
      # Context = repo root so the multi-stage Dockerfile can also build the
      # mobile PWA (clients/mobile-web) and embed it into the Go binary.
      context: ..
      dockerfile: server/Dockerfile
      args:
        TARGETOS: linux
        TARGETARCH: amd64
    pull_policy: never
    container_name: bookeeper-neo-server
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SERVICE_NAME: ${SERVICE_NAME:-Bookeeper}
      SERVER_HOST: ${SERVER_HOST:?SERVER_HOST required}
      SERVER_PORT: ${PUBLIC_HTTPS_PORT:?PUBLIC_HTTPS_PORT required}
      ENABLE_MDNS: "false"
      TRUST_POOL_PATH: /certs/trusted_clients.pem
      CADDY_ADMIN_URL: http://bookeeper-neo-caddy:2019
    volumes:
      - data:/data
      - certs:/certs
    expose:
      - "7842"
      - "7843"
    networks:
      - internal
    # Lock down container privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------- Caddy (public reverse proxy + ACME + mTLS) ----------------
  caddy:
    image: caddy:2.8-alpine
    container_name: bookeeper-neo-caddy
    restart: unless-stopped
    depends_on:
      - bookeeper-server
    ports:
      # Bind to a SPECIFIC host interface (HOST_BIND_IP). If you use
      # 127.0.0.1, your existing reverse proxy must passthrough to here.
      # If you use a dedicated public IP, set it directly.
      - "${HOST_BIND_IP:?HOST_BIND_IP required (e.g. 127.0.0.1 or a floating IP)}:${PUBLIC_HTTPS_PORT}:443"
      - "${HOST_BIND_IP}:${ACME_HTTP_PORT}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certs:/certs
      - caddy-data:/data
      - caddy-config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required}
      SERVER_HOST: ${SERVER_HOST}
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  # ---------------- Tailscale (bootstrap/pairing on tailnet only) ----------------
  tailscale:
    image: tailscale/tailscale:stable
    container_name: bookeeper-neo-tailscale
    hostname: ${TS_HOSTNAME:-bookeeper}
    restart: unless-stopped
    depends_on:
      - bookeeper-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY required}
      TS_HOSTNAME: ${TS_HOSTNAME:-bookeeper}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:bookeeper --accept-dns=false
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      # serve.json is generated by gen-serve-config.sh before `docker
      # compose up`; it maps tailnet HTTPS:443 → bookeeper-server:7843.
      - ./tailscale-serve.json:/config/serve.json:ro
    networks:
      - internal

  # ---------------- Backup (optional) ----------------
  backup:
    image: mazzolino/restic:latest
    container_name: bookeeper-neo-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      - bookeeper-server
    environment:
      RUN_ON_STARTUP: "false"
      BACKUP_CRON: "30 3 * * *"
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
      RESTIC_BACKUP_SOURCES: /source
      RESTIC_BACKUP_TAGS: bookeeper
      RESTIC_FORGET_ARGS: >-
        --keep-daily 7
        --keep-weekly 4
        --keep-monthly 6
        --prune
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      B2_ACCOUNT_ID: ${BACKUP_B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${BACKUP_B2_ACCOUNT_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - data:/source/data:ro
      - certs:/source/certs:ro
      - backup-cache:/var/cache/restic
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

# All resources prefixed by the `name:` directive above (bookeeper-neo_*).
volumes:
  data:
    name: bookeeper-neo-data
  certs:
    name: bookeeper-neo-certs
  caddy-data:
    name: bookeeper-neo-caddy-data
  caddy-config:
    name: bookeeper-neo-caddy-config
  tailscale-state:
    name: bookeeper-neo-tailscale-state
  backup-cache:
    name: bookeeper-neo-backup-cache

networks:
  # Dedicated bridge with FIXED subnet far from common defaults so it
  # cannot collide with subnets used by other compose projects on the
  # same host. Change BOOKEEPER_SUBNET in .env if 172.31.7.0/24 is taken.
  internal:
    name: bookeeper-neo-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-bookeeper
    ipam:
      config:
        - subnet: ${BOOKEEPER_SUBNET:-172.31.7.0/24}
