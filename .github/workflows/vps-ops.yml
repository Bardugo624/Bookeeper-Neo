name: VPS ops

# Runs ops/vps/run.sh on the VPS over SSH. Needs the repository secret
# VPS_SSH_KEY (private key, PEM or base64). Optional: VPS_KNOWN_HOSTS
# (output of `ssh-keyscan -t ed25519 <host>`); without it the host key is
# trusted on first use and its fingerprint is printed.

on:
  push:
    branches: [claude/funny-bell-g5wrux]
    paths:
      - "ops/vps/run.sh"
      - ".github/workflows/vps-ops.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: 82.165.185.245
      VPS_USER: root
      VPS_PORT: "22"
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Repository secret VPS_SSH_KEY is not set"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if printf '%s' "$VPS_SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_vps
          fi
          chmod 600 ~/.ssh/id_vps
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" -t ed25519 "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::VPS_KNOWN_HOSTS is not set: host key trusted on first use"
            ssh-keygen -lf ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/id_vps
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          CFG
          chmod 600 ~/.ssh/config
      - name: Run ops/vps/run.sh on the VPS
        run: ssh vps 'bash -s' < ops/vps/run.sh
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_vps
