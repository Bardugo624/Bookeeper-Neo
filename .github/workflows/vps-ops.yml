name: VPS ops

# Manual only. Runs the read-only ops/vps/run.sh on the VPS over SSH. Needs the
# repository secret VPS_SSH_KEY.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: 82.165.185.245
      VPS_USER: root
      VPS_PORT: "22"
      VPS_HOST_KEY: "SHA256:aT+GlEdo8ocxbB3WUGXnDAo7j7dotW8LepYZELK2Uj8"
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        uses: ./.github/actions/vps-ssh
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          host-key: ${{ env.VPS_HOST_KEY }}
          verify: "false"
      - name: Run ops/vps/run.sh on the VPS
        run: ssh vps 'bash -s' < ops/vps/run.sh
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_vps
