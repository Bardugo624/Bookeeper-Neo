name: Release

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release and push the image (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # True only for a tag push (the only push trigger) or a manual run with `publish` ticked.
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      major: ${{ steps.v.outputs.major }}
      minor: ${{ steps.v.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        id: v
        run: |
          version=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version[[:space:]]*=/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::Cannot read the workspace version from Cargo.toml"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the workspace version in Cargo.toml (expected v${version})"
            exit 1
          fi
          tauri_version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' apps/desktop/src-tauri/tauri.conf.json | head -1)
          if [ "$tauri_version" != "$version" ]; then
            echo "::error::apps/desktop/src-tauri/tauri.conf.json has version ${tauri_version}, Cargo.toml has ${version}"
            exit 1
          fi
          setup_version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' apps/setup/package.json | head -1)
          if [ "$setup_version" != "$version" ]; then
            echo "::error::apps/setup/package.json has version ${setup_version}, Cargo.toml has ${version}"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ]; then
            if ! node scripts/release-notes.mjs --version "$version" --out /dev/null; then
              echo "::error::CHANGELOG.md has no section for ${version}"
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          core=${version%%-*}
          echo "minor=${core%.*}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @bookeeper/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-dist
          path: apps/mobile/dist
          if-no-files-found: error

  server:
    needs: [check, web]
    name: server (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
            run: true
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
            run: false
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
            run: true
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            zig: false
            run: true
          - name: macos-amd64
            runner: macos-latest
            target: x86_64-apple-darwin
            zig: false
            run: false
    env:
      VERSION: ${{ needs.check.outputs.version }}
      NAME: ${{ matrix.name }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # The binary embeds apps/mobile/dist: it must be in place before cargo runs.
      - uses: actions/download-artifact@v4
        with:
          name: mobile-dist
          path: apps/mobile/dist
      - uses: actions/setup-python@v5
        if: matrix.zig
        with:
          python-version: "3.12"
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --locked -p bookeeper-server --target ${{ matrix.target }}
      - name: Build (windows, static CRT)
        if: matrix.name == 'windows-amd64'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p bookeeper-server --target ${{ matrix.target }}
      - name: Build (macos)
        if: startsWith(matrix.name, 'macos-')
        run: cargo build --release --locked -p bookeeper-server --target ${{ matrix.target }}
      - name: Binary reports the version
        if: matrix.run
        shell: bash
        run: |
          exe=target/${TARGET}/release/bookeeper-server
          [ "$RUNNER_OS" = Windows ] && exe="${exe}.exe"
          out=$("$exe" --version)
          echo "$out"
          case "$out" in *"$VERSION"*) ;; *) echo "::error::--version does not print ${VERSION}"; exit 1;; esac
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: |
          pkg=bookeeper-server-${VERSION}-${NAME}
          mkdir "$pkg"
          cp "target/${TARGET}/release/bookeeper-server" LICENSE "$pkg/"
          tar -czf "${pkg}.tar.gz" "$pkg"
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "bookeeper-server-$env:VERSION-$env:NAME"
          New-Item -ItemType Directory $pkg | Out-Null
          Copy-Item "target/$env:TARGET/release/bookeeper-server.exe", LICENSE $pkg
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"
      - name: Bare binary (for the Docker image)
        if: startsWith(matrix.name, 'linux-')
        run: cp "target/${TARGET}/release/bookeeper-server" bookeeper-server
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.name, 'linux-')
        with:
          name: server-bin-${{ matrix.name }}
          path: bookeeper-server
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.name }}
          path: |
            bookeeper-server-*.tar.gz
            bookeeper-server-*.zip
          if-no-files-found: error

  docker:
    needs: [check, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bookeeper-server" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: server-bin-linux-amd64
          path: docker-context/bin/amd64
      - uses: actions/download-artifact@v4
        with:
          name: server-bin-linux-arm64
          path: docker-context/bin/arm64
      - name: Prepare the build context
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x docker-context/bin/*/bookeeper-server
          mkdir docker-context/data
          touch docker-context/data/.keep
      # QEMU only assembles the arm64 image: Dockerfile.release has no RUN, nothing runs under emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image and check its version
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          platforms: linux/amd64
          load: true
          tags: bookeeper-server:verify
      - name: Image reports the version
        run: |
          out=$(docker run --rm bookeeper-server:verify --version)
          echo "$out"
          case "$out" in *"$VERSION"*) ;; *) echo "::error::--version does not print ${VERSION}"; exit 1;; esac
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=${{ needs.check.outputs.minor }},enable=${{ needs.check.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.check.outputs.major }},enable=${{ needs.check.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  desktop:
    needs: check
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      BOOKEEPER_UPDATER_PUBKEY: ${{ vars.BOOKEEPER_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System libraries (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf xdg-utils
      - run: npm ci
      - name: Build the light Setup (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run tauri -w @bookeeper/setup -- build --no-bundle --target "$TARGET"
          exe="target/${TARGET}/release/bookeeper-setup.exe"
          [ -f "$exe" ] || exe="apps/setup/src-tauri/target/${TARGET}/release/bookeeper-setup.exe"
          if [ ! -f "$exe" ]; then
            echo "::error::bookeeper-setup.exe was not built for ${TARGET}"
            exit 1
          fi
          cp "$exe" apps/desktop/src-tauri/windows/bookeeper-setup.exe
          ls -l apps/desktop/src-tauri/windows/bookeeper-setup.exe
      - name: DLL dependencies of the light Setup (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          }
          if ($dumpbin) {
            & $dumpbin /dependents apps/desktop/src-tauri/windows/bookeeper-setup.exe
          } else {
            Write-Host "::warning::dumpbin not found: DLL dependencies not listed"
          }
        continue-on-error: true
      - name: Merge the DMG background (macos)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          # Set for the Build step too (macOS only; the DMG bundler must not skip Finder styling on CI).
          echo "TAURI_BUNDLER_DMG_IGNORE_CI=true" >> "$GITHUB_ENV"
          tiffutil -cathidpicheck apps/desktop/src-tauri/dmg/background.png apps/desktop/src-tauri/dmg/background@2x.png \
            -out apps/desktop/src-tauri/dmg/background.tiff
          ls -l apps/desktop/src-tauri/dmg
      - name: Build
        shell: bash
        run: |
          build() {
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$BOOKEEPER_UPDATER_PUBKEY" ]; then
              # The CLI wants plugins.updater.pubkey in the configuration when it makes update artifacts.
              cfg=$(node -e 'console.log(JSON.stringify({plugins:{updater:{pubkey:process.env.BOOKEEPER_UPDATER_PUBKEY}}}))')
              if [ "$RUNNER_OS" = macOS ]; then
                cfg=$(node -e 'const c=JSON.parse(process.argv[1]);c.bundle={macOS:{dmg:{background:"dmg/background.tiff"}}};console.log(JSON.stringify(c))' "$cfg")
              fi
              npm run tauri build -w @bookeeper/desktop -- --target "$TARGET" --config "$cfg"
            else
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY or BOOKEEPER_UPDATER_PUBKEY is not set: building installers without update artifacts"
              if [ "$RUNNER_OS" = macOS ]; then
                npm run tauri build -w @bookeeper/desktop -- --target "$TARGET" \
                  --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"dmg":{"background":"dmg/background.tiff"}}}}'
              else
                npm run tauri build -w @bookeeper/desktop -- --target "$TARGET" \
                  --config '{"bundle":{"createUpdaterArtifacts":false}}'
              fi
            fi
          }
          if [ "$RUNNER_OS" = macOS ]; then
            # The DMG step is flaky on runners: retry once.
            build || { echo "::warning::build failed, retrying once"; build; }
          else
            build
          fi
      - name: Collect
        shell: bash
        run: |
          bundle="target/${TARGET}/release/bundle"
          [ -d "$bundle" ] || bundle="apps/desktop/src-tauri/target/${TARGET}/release/bundle"
          [ -d "$bundle" ] || { echo "::error::bundle folder not found"; exit 1; }
          mkdir -p out/installers out/updates
          find "$bundle" -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/installers/ \;
          # Update artifacts: the NSIS and AppImage installers themselves, and the .app.tar.gz.
          # The macOS archive has the same name on both architectures: add the architecture.
          for f in out/installers/*-setup.exe out/installers/*.AppImage; do
            [ -f "$f" ] || continue
            if [ -f "$(find "$bundle" -name "$(basename "$f").sig" | head -1)" ]; then
              cp "$f" out/updates/
              cp "$(find "$bundle" -name "$(basename "$f").sig" | head -1)" out/updates/
            fi
          done
          tgz=$(find "$bundle" -name '*.app.tar.gz' | head -1)
          if [ -n "$tgz" ] && [ -f "${tgz}.sig" ]; then
            cp "$tgz" "out/updates/Bookeeper_${VERSION}_${ARCH}.app.tar.gz"
            cp "${tgz}.sig" "out/updates/Bookeeper_${VERSION}_${ARCH}.app.tar.gz.sig"
          fi
          if [ -z "$(ls out/installers)" ]; then echo "::error::no installer built"; exit 1; fi
          ls -l out/installers out/updates
      - name: Assemble the Setup (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bundle="target/${TARGET}/release/bundle"
          [ -d "$bundle" ] || bundle="apps/desktop/src-tauri/target/${TARGET}/release/bundle"
          nsis=$(find "$bundle/nsis" -maxdepth 1 -name '*-setup.exe' 2>/dev/null | head -1 || true)
          main="target/${TARGET}/release/bookeeper-desktop.exe"
          [ -f "$main" ] || main="apps/desktop/src-tauri/target/${TARGET}/release/bookeeper-desktop.exe"
          [ -f "$nsis" ] && [ -f "$main" ] || { echo "::error::NSIS installer or bookeeper-desktop.exe not found"; exit 1; }
          node scripts/setup/assemble.mjs \
            --setup apps/desktop/src-tauri/windows/bookeeper-setup.exe \
            --payload "$nsis" \
            --main "$main" \
            --version "$VERSION" \
            --out "out/installers/Bookeeper-Setup-${VERSION}.exe"
          echo "SETUP_EXE=$(pwd -W)/out/installers/Bookeeper-Setup-${VERSION}.exe" >> "$GITHUB_ENV"
          echo "CLASSIC_EXE=$(pwd -W)/$nsis" >> "$GITHUB_ENV"
          echo "MAIN_EXE=$(pwd -W)/$main" >> "$GITHUB_ENV"
      - name: Smoke test the Setup (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BOOKEEPER_SETUP_ALLOW_ELEVATED: "1"
        run: pwsh scripts/setup/smoke.ps1 -Setup $env:SETUP_EXE -Classic $env:CLASSIC_EXE -Main $env:MAIN_EXE
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: out/installers/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: updates-${{ matrix.name }}
          path: out/updates/*
          if-no-files-found: ignore

  release:
    needs: [check, server, docker, desktop]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release notes from the CHANGELOG
        run: node scripts/release-notes.mjs --version "${{ needs.check.outputs.version }}" --out release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum bookeeper-server-* Bookeeper_* Bookeeper-Setup-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          files: |
            dist/bookeeper-server-*
            dist/Bookeeper_*
            dist/Bookeeper-Setup-*
            dist/SHA256SUMS

  publish-updates:
    needs: [check, desktop, release]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    # One publisher at a time across all runs, so manifests are never written concurrently.
    concurrency:
      group: publish-updates
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.check.outputs.version }}
      VPS_HOST: 82.165.185.245
      VPS_USER: root
      VPS_PORT: "22"
      VPS_HOST_KEY: "SHA256:aT+GlEdo8ocxbB3WUGXnDAo7j7dotW8LepYZELK2Uj8"
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      UPDATES_BASE: ${{ vars.UPDATES_BASE || 'https://updates.neokeeper.dev/v2' }}
      UPDATES_REDIRECT: ${{ vars.UPDATES_REDIRECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: updates-*
          path: updates
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Is there anything to publish
        id: gate
        run: |
          signed=true
          if ! ls updates/*.sig >/dev/null 2>&1; then
            signed=false
            echo "::warning::No signed update artifacts: updates are not published"
          fi
          missing=""
          for n in R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::warning::R2 is not published, missing:$missing (R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are repository secrets, the others variables)"
          fi
          if [ -z "$missing" ] && [ "$signed" = true ]; then
            echo "r2=true" >> "$GITHUB_OUTPUT"
          else
            echo "r2=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning::VPS_SSH_KEY is not set: the VPS is not updated"
          fi
          if [ "$UPDATES_REDIRECT" = on ]; then
            echo "::warning::UPDATES_REDIRECT is on: the VPS is not updated, R2 serves the updates"
          fi
          if [ -n "$VPS_SSH_KEY" ] && [ "$UPDATES_REDIRECT" != on ] && [ "$signed" = true ]; then
            echo "vps=true" >> "$GITHUB_OUTPUT"
          else
            echo "vps=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        if: steps.gate.outputs.r2 == 'true' || steps.gate.outputs.vps == 'true'
        run: node scripts/release-notes.mjs --version "$VERSION" --out release-notes.md
      - name: Publish to R2
        if: steps.gate.outputs.r2 == 'true'
        run: |
          node scripts/updates-r2.mjs publish --version "$VERSION" --updates updates --installers installers --notes-file release-notes.md --base "$UPDATES_BASE"
      - name: Manifest
        id: manifest
        if: steps.gate.outputs.vps == 'true'
        run: |
          channel=$(node scripts/update-manifest.mjs --dir updates --version "$VERSION" \
            --base-url https://app.neokeeper.dev/updates \
            --notes-file release-notes.md \
            --out latest.json)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          cat latest.json
      - name: SSH setup
        if: steps.gate.outputs.vps == 'true'
        uses: ./.github/actions/vps-ssh
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          host-key: ${{ env.VPS_HOST_KEY }}
      - name: Upload the files, then the manifest
        if: steps.gate.outputs.vps == 'true'
        env:
          CHANNEL: ${{ steps.manifest.outputs.channel }}
        run: |
          dest=/opt/bookeeper/updates
          ssh vps "mkdir -p ${dest}/files/${VERSION} ${dest}/stable ${dest}/beta"
          scp updates/* "vps:${dest}/files/${VERSION}/"
          scp latest.json "vps:${dest}/.latest-${VERSION}.json.tmp"
          # The manifest goes last and atomically; a stable release also moves the beta channel.
          # A manifest is never replaced by an older version; the newest 3 folders and the
          # ones the live manifests still point to are kept.
          ssh vps "bash -s" -- "$dest" "$VERSION" "$CHANNEL" <<'REMOTE'
          set -eu
          dest=$1; version=$2; channel=$3
          cd "$dest"
          tmp=".latest-${version}.json.tmp"
          key() { printf '%s' "$1" | tr '-' '~'; }
          newer_or_absent() {
            [ -f "$1/latest.json" ] || return 0
            cur=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1/latest.json" | head -1)
            [ -z "$cur" ] && return 0
            [ "$cur" = "$version" ] && return 0
            [ "$(printf '%s\n%s\n' "$(key "$cur")" "$(key "$version")" | sort -V | tail -1)" = "$(key "$version")" ]
          }
          publish() {
            if newer_or_absent "$1"; then
              cp "$tmp" "$1/.latest.json.new-${version}"
              mv "$1/.latest.json.new-${version}" "$1/latest.json"
            else
              echo "Keeping the newer manifest in $1"
            fi
          }
          publish "$channel"
          if [ "$channel" = stable ]; then publish beta; fi
          rm -f "$tmp"
          cd files
          keep=$(ls -1dt */ | head -3 | tr -d /)
          for m in ../stable/latest.json ../beta/latest.json; do
            [ -f "$m" ] || continue
            keep="$keep
          $(grep -o '/files/[^/]*/' "$m" | cut -d/ -f3)"
          done
          for d in */; do
            d=${d%/}
            printf '%s\n' "$keep" | grep -qxF "$d" || rm -rf -- "$d"
          done
          REMOTE
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_vps
