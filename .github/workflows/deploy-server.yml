name: Deploy server

# Mirror della logica eseguita localmente da deploy/scripts/deploy.ps1 (azione
# "deploy"): rsync server/ + deploy/ verso /opt/bookeeper-neo, rebuild
# dell'immagine Go, restart del container, healthcheck.
#
# Trigger:
#   - push su main che tocca server/ o deploy/ (deploy automatico)
#   - workflow_dispatch (deploy manuale dal tab Actions o via `gh workflow run`)
#
# Secrets richiesti (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY        chiave privata ED25519 (PEM) autorizzata su root@host
#   DEPLOY_HOST           es. 46.224.218.228
#   DEPLOY_USER           es. root
#   DEPLOY_KNOWN_HOSTS    output di `ssh-keyscan -t ed25519 <host>` (1 riga)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:
    inputs:
      skip_rebuild:
        description: 'Salta build immagine (solo restart)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Un deploy alla volta — annulla deploy in coda obsoleti.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://bookeeper.albacremisi.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # rsync invoca ssh con questa chiave + verifica known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
              HostName ${{ secrets.DEPLOY_HOST }}
              User ${{ secrets.DEPLOY_USER }}
              IdentityFile ~/.ssh/id_deploy
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              UserKnownHostsFile ~/.ssh/known_hosts
              ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync server/
        run: |
          rsync -az --delete \
            --exclude='*.db' --exclude='*.db-*' --exclude='data/' \
            ./server/ deploy-target:/opt/bookeeper-neo/server/

      - name: Sync deploy/ (preserve .env)
        run: |
          rsync -az \
            --exclude='.env' --exclude='*.local' \
            ./deploy/ deploy-target:/opt/bookeeper-neo/deploy/

      - name: Rebuild image
        if: ${{ inputs.skip_rebuild != 'true' }}
        run: |
          ssh deploy-target bash -se <<'REMOTE'
          set -euo pipefail
          chmod +x /opt/bookeeper-neo/deploy/scripts/*.sh 2>/dev/null || true
          cd /opt/bookeeper-neo/deploy
          docker compose --project-name bookeeper-neo build --pull bookeeper-server
          REMOTE

      - name: Restart container
        run: |
          ssh deploy-target bash -se <<'REMOTE'
          set -euo pipefail
          cd /opt/bookeeper-neo/deploy
          docker compose --project-name bookeeper-neo up -d bookeeper-server
          REMOTE

      - name: Health check
        run: |
          ssh deploy-target bash -se <<'REMOTE'
          set -euo pipefail
          sleep 5
          state=$(docker inspect -f '{{.State.Status}}' bookeeper-neo-server)
          echo "Container state: $state"
          if [ "$state" != "running" ]; then
              echo "::error::Container non in running state"
              docker logs --tail 50 bookeeper-neo-server
              exit 1
          fi
          echo '--- Last 20 log lines ---'
          docker logs --tail 20 bookeeper-neo-server 2>&1
          # Migrazione goose riuscita?
          if docker logs --tail 100 bookeeper-neo-server 2>&1 | grep -qiE '(error|panic|fatal)'; then
              echo "::warning::Errori rilevati nei log recenti — verifica manualmente"
          fi
          REMOTE

      - name: Cleanup SSH
        if: always()
        run: |
          shred -uvz ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
