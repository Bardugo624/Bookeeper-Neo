name: CI

on:
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run build:2

  openapi:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Snapshot matches the core
        run: cargo test -p bookeeper-core --test openapi -- --include-ignored
      - run: npm ci
      - run: npm run gen -w @bookeeper/api
      - name: Types match the snapshot
        run: git diff --exit-code packages/api

  desktop-build:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @bookeeper/desktop
      - run: cargo build -p bookeeper-desktop

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64, not published)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: bookeeper-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container
        run: docker run -d --name bookeeper -p 7842:7842 bookeeper-server:ci
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' bookeeper)
            echo "health: $s"
            [ "$s" = healthy ] && exit 0
            sleep 2
          done
          docker logs bookeeper
          exit 1
      - name: Smoke test
        run: |
          code=$(docker logs bookeeper 2>&1 | grep -oE '[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}' | head -1)
          test -n "$code"
          scripts/smoke.sh http://127.0.0.1:7842 "$code"
      - name: Container logs on failure
        if: failure()
        run: docker logs bookeeper
