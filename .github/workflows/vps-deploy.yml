name: VPS deploy

# Manual only, from main. target=server builds the image, loads it on the VPS and runs
# ops/vps/deploy/deploy.sh; target=caddy only reinstalls the Caddy site.
# With UPDATES_REDIRECT=on the R2 site is installed, after R2 is checked to be ready.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [server, caddy]
        default: server

permissions:
  contents: read

concurrency:
  group: vps-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS_HOST: 82.165.185.245
      VPS_USER: root
      VPS_PORT: "22"
      VPS_HOST_KEY: "SHA256:aT+GlEdo8ocxbB3WUGXnDAo7j7dotW8LepYZELK2Uj8"
      UPDATES_BASE: ${{ vars.UPDATES_BASE || 'https://updates.neokeeper.dev/v2' }}
      UPDATES_REDIRECT: ${{ vars.UPDATES_REDIRECT }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow runs only from main"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: R2 is ready
        if: vars.UPDATES_REDIRECT == 'on'
        run: node scripts/updates-r2.mjs ready --base "$UPDATES_BASE" --vps https://app.neokeeper.dev/updates
      - name: Choose the Caddy site
        run: |
          if [ "$UPDATES_REDIRECT" = on ]; then site=bookeeper-r2.caddy; else site=bookeeper.caddy; fi
          echo "SITE=ops/vps/deploy/$site" >> "$GITHUB_ENV"
      - name: SSH setup
        uses: ./.github/actions/vps-ssh
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          host-key: ${{ env.VPS_HOST_KEY }}
      - name: Build the image
        if: inputs.target == 'server'
        run: docker build -t bookeeper-server:deploy .
      - name: Load the image on the VPS
        if: inputs.target == 'server'
        run: docker save bookeeper-server:deploy | gzip | ssh vps 'gunzip | docker load'
      - name: Deploy the server
        if: inputs.target == 'server'
        run: |
          ssh vps 'mkdir -p /opt/bookeeper'
          scp ops/vps/deploy/docker-compose.yml ops/vps/deploy/deploy.sh ops/vps/deploy/caddy.sh vps:/opt/bookeeper/
          scp "$SITE" vps:/opt/bookeeper/bookeeper.caddy
          ssh vps 'bash /opt/bookeeper/deploy.sh'
      - name: Deploy the Caddy site
        if: inputs.target == 'caddy'
        run: |
          ssh vps 'mkdir -p /opt/bookeeper'
          scp ops/vps/deploy/caddy.sh vps:/opt/bookeeper/
          scp "$SITE" vps:/opt/bookeeper/bookeeper.caddy
          ssh vps 'bash /opt/bookeeper/caddy.sh'
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_vps
